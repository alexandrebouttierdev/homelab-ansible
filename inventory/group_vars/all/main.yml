---
# ==============================================================================
# VARIABLES GLOBALES - HOMELAB DEBIAN 13 (DELL OPTIPLEX 3060 - 16 GO RAM)
# Secrets : inventory/group_vars/all/vault.yml (Ansible Vault)
# ==============================================================================

# Système & Cible
expected_distribution: Debian
expected_distribution_major_version: "13"
timezone: Europe/Paris
min_disk_space_gb: 5

# Compte Administrateur
admin_user: alex
admin_groups: [sudo]
admin_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/homelab_ed25519.pub"

# Réseau & Pare-feu
# Adapter lors d'une migration VLAN (ex. 10.0.1.0/24 ou 10.0.10.0/24).
# Ne pas modifier automatiquement tant que le LAN reste en 192.168.1.0/24.
admin_cidr: "192.168.1.0/24"
ssh_port: 22

# Sécurité & Durcissement
# IMPORTANT : passer ssh_hardening_enabled à true UNIQUEMENT après validation
# d'une connexion par clé dans une deuxième session SSH.
ssh_hardening_enabled: true
ssh_password_authentication: "no"
ssh_permit_root_login: "no"

unattended_upgrades_enabled: true
apparmor_enabled: true
ufw_enabled: true
fail2ban_enabled: true
# Réseaux exclus de Fail2ban (évite de se bannir depuis le LAN d'admin)
fail2ban_ignoreip: "127.0.0.1/8 ::1"

# Mémoire & Swap (16 Go RAM + PostgreSQL + NestJS)
swap_enabled: true
swap_file_path: /swapfile
swap_file_size_mb: 2048
vm_swappiness: 10
vm_vfs_cache_pressure: 50

# Conteneurisation Docker
docker_install: true
docker_log_max_size: "10m"
docker_log_max_file: "3"
docker_live_restore: true
# false limite certaines NAT legacy ; compatible Coolify en usage courant.
docker_userland_proxy: false
# Le groupe docker ≈ root. Laisser false et utiliser sudo docker.
docker_add_admin_user: false

# Coolify auto-hébergé
coolify_enabled: true
coolify_installer_url: https://cdn.coollabs.io/coolify/install.sh
coolify_data_dir: /data/coolify
coolify_dashboard_port: 8000
coolify_docker_address_pool_base: 172.20.0.0/14
coolify_docker_address_pool_size: 24
coolify_ports:
  - 8000
  - 6001
  - 6002
  - 80
  - 443

# Supervision et administration hôte : MonoOps (binaire natif systemd)
# https://github.com/alexandrebouttierdev/monoops
monoops_enabled: true
# Version et empreinte SHA-256 (fichier SHA256SUMS de la release) de l'archive.
# Mettre à jour les deux valeurs ensemble après vérification indépendante.
# 3.0.0 est la première release publiée sous le nom MonoOps (archives
# monoops_<version>_linux_<arch>.tar.gz) : renseigner son empreinte amd64 dès
# sa publication. Tant qu'elle est vide, le rôle s'arrête sur son assertion.
monoops_version: "3.0.0"
monoops_sha256: ""
monoops_arch: amd64
# 8080 (défaut amont) est pris par le proxy Traefik de Coolify.
monoops_port: 9090
monoops_metrics_retention_days: 7
# Modules optionnels (chacun installe sa règle polkit dédiée).
monoops_backup_enabled: true
monoops_vulnscan_enabled: true
monoops_journal_vacuum_enabled: true
monoops_power_actions_enabled: true
# Grype (module Vulnérabilités) : version figée par MonoOps et
# empreinte du .deb amd64 (grype_<version>_checksums.txt de la release).
monoops_grype_version: "0.121.3"
monoops_grype_sha256: "4a4fc1c323cbe19f17aed5ed6dc4e0867198bb4fe3d5552579c10f9085310fa1"

# Cloudflare Tunnel natif (systemd)
# Activer après avoir renseigné cloudflared_tunnel_token dans vault.yml
cloudflared_enabled: false
cloudflared_tunnel_token: ""
