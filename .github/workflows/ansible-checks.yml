name: Ansible checks

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Ansible validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible validation tools
        run: python -m pip install ansible-core ansible-lint yamllint

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run repository static checks
        run: ./scripts/static-checks.sh
