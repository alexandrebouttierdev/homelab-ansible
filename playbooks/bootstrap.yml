---
- name: Bootstrap initial de sudo pour Debian 13
  hosts: homelab
  # Les facts sont collectés après l'installation de Python : une Debian
  # minimale (sans « utilitaires usuels du système ») ne fournit pas python3.
  gather_facts: false
  become: true
  become_method: ansible.builtin.su
  become_user: root
  tasks:
    - name: Installer python3 si absent (prérequis des modules Ansible)
      ansible.builtin.raw: >-
        if command -v python3 >/dev/null 2>&1; then
        echo "python3-present";
        else
        apt-get update -q && DEBIAN_FRONTEND=noninteractive
        apt-get install -y -q --no-install-recommends python3;
        fi
      register: bootstrap_python
      changed_when: "'python3-present' not in bootstrap_python.stdout"

    - name: Collecter les facts
      ansible.builtin.setup:

    - name: Vérifier que la cible est Debian 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == expected_distribution
          - ansible_distribution_major_version == expected_distribution_major_version
        fail_msg: >-
          Ce bootstrap cible exclusivement {{ expected_distribution }}
          {{ expected_distribution_major_version }}.

    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Ajouter le compte administrateur au groupe sudo
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true

    - name: Autoriser le groupe sudo avec authentification par mot de passe
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-provision-serveur-admin
        owner: root
        group: root
        mode: "0440"
        content: |
          %sudo ALL=(ALL:ALL) ALL
        validate: /usr/sbin/visudo -cf %s

    - name: Retirer l'ancienne règle locale sans mot de passe si elle existe
      ansible.builtin.file:
        path: /etc/sudoers.d/ansible-alex
        state: absent

    - name: Vérifier la syntaxe de la configuration sudo
      ansible.builtin.command:
        cmd: /usr/sbin/visudo -c
      changed_when: false

    - name: Confirmer la fin du bootstrap
      ansible.builtin.debug:
        msg: >-
          Bootstrap terminé. La connexion SSH va être réinitialisée pour
          prendre en compte l'appartenance au groupe sudo.

    - name: Réinitialiser la connexion SSH
      ansible.builtin.meta: reset_connection
