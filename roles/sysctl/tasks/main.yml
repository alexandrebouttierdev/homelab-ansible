---
- name: Appliquer les optimisations noyau et sécurité (sysctl)
  ansible.builtin.template:
    src: 99-provision-serveur.conf.j2
    dest: /etc/sysctl.d/99-provision-serveur.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Charger immédiatement les paramètres sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
