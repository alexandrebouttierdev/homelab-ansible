---
- name: Vérifier la disponibilité de Docker
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: beszel_hub_docker_binary
  when: beszel_hub_enabled | bool

- name: Vérifier si l'unité Beszel Hub existe déjà
  ansible.builtin.stat:
    path: /etc/systemd/system/beszel-hub.service
  register: beszel_hub_unit
  when: beszel_hub_enabled | bool

- name: Signaler que Beszel Hub sera installé après Docker
  ansible.builtin.debug:
    msg: >-
      Beszel Hub sera installé lors de l'application réelle du playbook,
      après Docker. Le mode --check ne peut pas démarrer un conteneur absent.
  when:
    - beszel_hub_enabled | bool
    - ansible_check_mode
    - not beszel_hub_docker_binary.stat.exists

- name: Créer le répertoire persistant du Hub Beszel
  ansible.builtin.file:
    path: "{{ beszel_hub_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - beszel_hub_enabled | bool
    - not ansible_check_mode or beszel_hub_docker_binary.stat.exists

- name: Télécharger ou actualiser l'image du Hub Beszel
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - pull
      - "{{ beszel_hub_image }}"
  register: beszel_hub_image_pull
  changed_when: "'Downloaded newer image' in beszel_hub_image_pull.stdout"
  when:
    - beszel_hub_enabled | bool
    - not ansible_check_mode
  notify: Restart beszel-hub

- name: Installer l'unité systemd du Hub Beszel
  ansible.builtin.template:
    src: beszel-hub.service.j2
    dest: /etc/systemd/system/beszel-hub.service
    owner: root
    group: root
    mode: "0644"
  when:
    - beszel_hub_enabled | bool
    - not ansible_check_mode or beszel_hub_docker_binary.stat.exists
  notify:
    - Reload systemd for Beszel Hub
    - Restart beszel-hub

- name: Activer et démarrer le Hub Beszel
  ansible.builtin.systemd_service:
    name: beszel-hub.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - beszel_hub_enabled | bool
    - not ansible_check_mode or beszel_hub_unit.stat.exists

- name: Arrêter le Hub Beszel s'il est désactivé
  ansible.builtin.systemd_service:
    name: beszel-hub.service
    enabled: false
    state: stopped
  when: not (beszel_hub_enabled | bool)
  failed_when: false
