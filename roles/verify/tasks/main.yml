---
- name: Collecter les paquets installés pour les vérifications de services
  ansible.builtin.package_facts:
    manager: auto

- name: Vérifier que le service SSH est actif
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
  check_mode: true
  register: verify_ssh
  failed_when: verify_ssh is changed or verify_ssh is failed
  when:
    - not ansible_check_mode or 'openssh-server' in ansible_facts.packages

- name: Vérifier que AppArmor est actif
  ansible.builtin.systemd_service:
    name: apparmor
    state: started
    enabled: true
  check_mode: true
  register: verify_apparmor
  failed_when: verify_apparmor is changed or verify_apparmor is failed
  when:
    - apparmor_enabled | bool
    - not ansible_check_mode or 'apparmor' in ansible_facts.packages

- name: Vérifier que Fail2ban est actif
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  check_mode: true
  register: verify_fail2ban
  failed_when: verify_fail2ban is changed or verify_fail2ban is failed
  when:
    - fail2ban_enabled | bool
    - not ansible_check_mode or 'fail2ban' in ansible_facts.packages

- name: Vérifier le statut UFW
  ansible.builtin.command:
    cmd: ufw status
  register: verify_ufw
  changed_when: false
  when: ufw_enabled | bool

- name: Vérifier que Docker fonctionne correctement
  ansible.builtin.command:
    cmd: docker info
  changed_when: false
  when: docker_install | bool

- name: Vérifier si Coolify est installé
  ansible.builtin.stat:
    path: "{{ coolify_data_dir }}/source/.env"
  register: verify_coolify_install
  when: coolify_enabled | bool

- name: Exiger l'installation de Coolify après un déploiement réel
  ansible.builtin.assert:
    that:
      - verify_coolify_install.stat.exists
    fail_msg: >-
      Coolify a été activé mais son installation est absente.
      Exécuter le playbook site.yml sans --check.
  when:
    - coolify_enabled | bool
    - not ansible_check_mode

- name: Vérifier que Cockpit est actif
  ansible.builtin.systemd_service:
    name: cockpit.socket
    state: started
    enabled: true
  check_mode: true
  register: verify_cockpit
  failed_when: verify_cockpit is changed or verify_cockpit is failed
  when:
    - cockpit_install | bool
    - not ansible_check_mode or 'cockpit' in ansible_facts.packages

- name: Vérifier si l'unité Beszel Hub existe
  ansible.builtin.stat:
    path: /etc/systemd/system/beszel-hub.service
  register: verify_beszel_hub_unit
  when: beszel_hub_enabled | bool

- name: Vérifier que Beszel Hub est actif
  ansible.builtin.systemd_service:
    name: beszel-hub.service
    state: started
    enabled: true
  check_mode: true
  register: verify_beszel_hub
  failed_when: verify_beszel_hub is changed or verify_beszel_hub is failed
  when:
    - beszel_hub_enabled | bool
    - not ansible_check_mode or verify_beszel_hub_unit.stat.exists

- name: Vérifier que pmlogger est actif
  ansible.builtin.systemd_service:
    name: pmlogger
    state: started
    enabled: true
  check_mode: true
  register: verify_pmlogger
  failed_when: verify_pmlogger is changed or verify_pmlogger is failed
  when:
    - cockpit_install | bool
    - pcp_pmlogger_enabled | default(true) | bool
    - not ansible_check_mode or 'pcp' in ansible_facts.packages

- name: Vérifier que l'agent Beszel est actif
  ansible.builtin.systemd_service:
    name: beszel-agent.service
    state: started
    enabled: true
  check_mode: true
  register: verify_beszel
  failed_when: verify_beszel is changed or verify_beszel is failed
  when:
    - not ansible_check_mode
    - beszel_agent_enabled | bool

- name: Vérifier que le tunnel Cloudflare est actif
  ansible.builtin.systemd_service:
    name: cloudflared-homelab.service
    state: started
    enabled: true
  check_mode: true
  register: verify_cloudflared
  failed_when: verify_cloudflared is changed or verify_cloudflared is failed
  when:
    - not ansible_check_mode
    - cloudflared_enabled | bool

- name: Vérifier les permissions du token Cloudflare
  ansible.builtin.stat:
    path: /etc/cloudflared/tunnel.token
  register: verify_cf_token
  when: cloudflared_enabled | bool

- name: Contrôler le mode du token Cloudflare
  ansible.builtin.assert:
    that:
      - verify_cf_token.stat.exists
      - verify_cf_token.stat.mode == '0640'
    fail_msg: "Permissions incorrectes sur /etc/cloudflared/tunnel.token (attendu 0640)."
  when: cloudflared_enabled | bool

- name: Afficher le statut final de validation
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "PROVISIONNEMENT VALIDÉ : Debian prêt pour Coolify,"
      - "PostgreSQL et les APIs NestJS."
      - "UFW : {{ verify_ufw.stdout_lines | default([]) | first | default('n/a', true) }}"
      - >-
        Coolify : {{ 'http://' ~ (ansible_host | default(inventory_hostname)) ~ ':8000' if coolify_enabled | bool else 'désactivé' }}
      - >-
        Beszel Hub : {{ 'http://' ~ (ansible_host | default(inventory_hostname)) ~ ':' ~ (beszel_hub_port | string) if beszel_hub_enabled | bool else 'désactivé' }}
      - >-
        Cockpit : {{ 'https://' ~ (ansible_host | default(inventory_hostname)) ~ ':' ~ (cockpit_port | string) if cockpit_install | bool else 'désactivé' }}
      - "Prochaine étape : docs/DEPLOIEMENT-APPLICATIONS.md"
      - "Sauvegardes : docs/SAUVEGARDES.md"
      - "============================================================"
