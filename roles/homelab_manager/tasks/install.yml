---
- name: Vérifier la version épinglée et les empreintes de Homelab Manager
  ansible.builtin.assert:
    that:
      - homelab_manager_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - homelab_manager_sha256 is match('^[a-fA-F0-9]{64}$')
      - homelab_manager_arch in ['amd64', 'arm64']
      - homelab_manager_port | int > 0
      - >-
        not (homelab_manager_vulnscan_enabled | bool) or (
        homelab_manager_grype_version is match('^[0-9]+\.[0-9]+\.[0-9]+$') and
        homelab_manager_grype_sha256 is match('^[a-fA-F0-9]{64}$'))
    fail_msg: >-
      Définir homelab_manager_version, homelab_manager_sha256 (et, pour Grype,
      homelab_manager_grype_version et homelab_manager_grype_sha256) avec des
      releases vérifiées.

- name: Refuser un port déjà utilisé par Coolify
  ansible.builtin.assert:
    that:
      - homelab_manager_port | int not in (coolify_ports | map('int') | list + [8080])
    fail_msg: >-
      Le port {{ homelab_manager_port }} est réservé à Coolify (8080 : tableau
      de bord Traefik du proxy Coolify). Choisir un autre homelab_manager_port.
  when: coolify_enabled | bool

- name: Vérifier si la release épinglée est déjà extraite
  ansible.builtin.stat:
    path: "{{ homelab_manager_release_dir }}/bin/homelab-manager"
  register: homelab_manager_release_stat

- name: Vérifier si l'unité Homelab Manager existe déjà
  ansible.builtin.stat:
    path: /etc/systemd/system/homelab-manager.service
  register: homelab_manager_unit_stat

- name: Signaler les tâches Homelab Manager non simulables
  ansible.builtin.debug:
    msg: >-
      La release {{ homelab_manager_version }} n'est pas encore extraite :
      l'installation des binaires, unités, règles polkit et de Grype sera
      effectuée lors de l'application réelle du playbook.
  when:
    - ansible_check_mode
    - not homelab_manager_release_stat.stat.exists

- name: Installer les dépendances de Homelab Manager
  ansible.builtin.apt:
    name: "{{ homelab_manager_packages }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Créer les groupes système de Homelab Manager
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop: "{{ homelab_manager_accounts }}"

- name: Créer les comptes système de Homelab Manager
  ansible.builtin.user:
    name: "{{ item }}"
    group: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present
  loop: "{{ homelab_manager_accounts }}"

# L'appartenance au groupe docker ≈ root : réservée au proxy restreint, qui
# n'autorise que des routes GET en liste blanche (actions sur les conteneurs
# désactivées).
- name: Autoriser le proxy restreint à lire le socket Docker
  ansible.builtin.user:
    name: homelab-docker-proxy
    groups: docker
    append: true
  when: docker_install | bool

- name: Créer les répertoires de Homelab Manager
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ homelab_manager_base_dir }}"
    - "{{ homelab_manager_download_dir }}"
    - "{{ homelab_manager_releases_dir }}"
    - "{{ homelab_manager_config_dir }}"
  register: homelab_manager_dirs_result

# En --check, les répertoires ci-dessus ne sont que simulés : get_url et
# template échoueraient alors sur une destination absente.
- name: Détecter les répertoires Homelab Manager seulement simulés
  ansible.builtin.set_fact:
    homelab_manager_dirs_simulated: "{{ ansible_check_mode and homelab_manager_dirs_result is changed }}"

- name: Télécharger et extraire la release Homelab Manager
  when:
    - not homelab_manager_release_stat.stat.exists
    - not homelab_manager_dirs_simulated
  block:
    - name: Télécharger l'archive Homelab Manager {{ homelab_manager_version }}
      ansible.builtin.get_url:
        url: "{{ homelab_manager_release_url }}"
        dest: "{{ homelab_manager_download_dir }}/{{ homelab_manager_release_name }}.tar.gz"
        checksum: "sha256:{{ homelab_manager_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Extraire l'archive Homelab Manager
      ansible.builtin.unarchive:
        src: "{{ homelab_manager_download_dir }}/{{ homelab_manager_release_name }}.tar.gz"
        dest: "{{ homelab_manager_releases_dir }}"
        remote_src: true
        owner: root
        group: root
        creates: "{{ homelab_manager_release_dir }}/bin/homelab-manager"
      when: not ansible_check_mode

- name: Installer les fichiers de la release
  when: not ansible_check_mode or homelab_manager_release_stat.stat.exists
  block:
    - name: Installer les binaires Homelab Manager
      ansible.builtin.copy:
        src: "{{ homelab_manager_release_dir }}/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop: "{{ homelab_manager_binaries }}"
      notify:
        - Restart homelab-docker-proxy
        - Restart homelab-manager

    - name: Installer les unités systemd de Homelab Manager
      ansible.builtin.copy:
        src: "{{ homelab_manager_release_dir }}/deployments/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ homelab_manager_units }}"
      notify:
        - Reload systemd for Homelab Manager
        - Restart homelab-docker-proxy
        - Restart homelab-manager

    - name: Créer le répertoire du drop-in de restauration en place
      ansible.builtin.file:
        path: /etc/systemd/system/homelab-backup@restore-in-place.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: homelab_manager_backup_enabled | bool

    - name: Installer le drop-in de restauration en place
      ansible.builtin.copy:
        src: "{{ homelab_manager_release_dir }}/deployments/systemd/homelab-backup@restore-in-place.service.d/50-in-place.conf"
        dest: /etc/systemd/system/homelab-backup@restore-in-place.service.d/50-in-place.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: homelab_manager_backup_enabled | bool
      notify: Reload systemd for Homelab Manager

    - name: Installer les règles tmpfiles.d des modules
      ansible.builtin.copy:
        src: "{{ homelab_manager_release_dir }}/deployments/tmpfiles/{{ item }}"
        dest: "/etc/tmpfiles.d/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ homelab_manager_tmpfiles }}"
      register: homelab_manager_tmpfiles_result

    # Crée les répertoires d'échange avant le démarrage du Manager :
    # ses ReadWritePaths= optionnels sont ignorés s'ils n'existent pas.
    - name: Créer les répertoires d'échange des modules
      ansible.builtin.command:
        argv:
          - systemd-tmpfiles
          - --create
          - "/etc/tmpfiles.d/{{ item.item }}"
      loop: "{{ homelab_manager_tmpfiles_result.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item is changed
      changed_when: true
      notify: Restart homelab-manager

    # Chaque règle n'autorise que le compte homelab-manager, sur les seules
    # unités ou actions de son module. polkitd les recharge automatiquement.
    - name: Installer les règles polkit des modules
      ansible.builtin.copy:
        src: "{{ homelab_manager_release_dir }}/deployments/polkit/{{ item }}"
        dest: "/etc/polkit-1/rules.d/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ homelab_manager_polkit_rules }}"

- name: Installer Grype pour le module Vulnérabilités
  when: homelab_manager_vulnscan_enabled | bool
  block:
    - name: Télécharger le paquet Grype {{ homelab_manager_grype_version }}
      ansible.builtin.get_url:
        url: "{{ homelab_manager_grype_url }}"
        dest: "{{ homelab_manager_download_dir }}/{{ homelab_manager_grype_deb }}"
        checksum: "sha256:{{ homelab_manager_grype_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      register: homelab_manager_grype_download
      when: not homelab_manager_dirs_simulated

    - name: Installer le paquet Grype
      ansible.builtin.apt:
        deb: "{{ homelab_manager_download_dir }}/{{ homelab_manager_grype_deb }}"
        state: present
      when: >-
        not ansible_check_mode or
        (homelab_manager_grype_download is not skipped and
         homelab_manager_grype_download is not changed)

- name: Déployer la configuration de Homelab Manager
  ansible.builtin.template:
    src: manager.yaml.j2
    dest: "{{ homelab_manager_config_dir }}/manager.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homelab-manager
  when: not homelab_manager_dirs_simulated

- name: Créer le magasin des secrets chiffrés systemd
  ansible.builtin.file:
    path: "{{ homelab_manager_credential_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Clé du coffre (TOTP, jetons des canaux, mots de passe restic) : 32 octets
# aléatoires générés sur le serveur et chiffrés par systemd-creds (TPM 2.0 si
# présent, sinon clé de l'hôte). Jamais régénérée : la remplacer rendrait
# illisibles les secrets déjà enregistrés.
- name: Générer la clé chiffrée du coffre de secrets (une seule fois)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      umask 077 &&
      head -c 32 /dev/urandom | base64 |
      systemd-creds encrypt --name=homelab-manager-secrets-key -
      {{ homelab_manager_credential_path }}
    executable: /bin/bash
    creates: "{{ homelab_manager_credential_path }}"
  no_log: true
  notify: Restart homelab-manager

- name: Activer et démarrer le socket du proxy Docker restreint
  ansible.builtin.systemd_service:
    name: homelab-docker-proxy.socket
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or homelab_manager_unit_stat.stat.exists

- name: Activer et démarrer Homelab Manager
  ansible.builtin.systemd_service:
    name: homelab-manager.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or homelab_manager_unit_stat.stat.exists
