---
# Chemins internes du rôle : dérivés de la version épinglée dans
# inventory/group_vars/all/main.yml, à ne pas surcharger.
homelab_manager_release_name: "homelab-manager_{{ homelab_manager_version }}_linux_{{ homelab_manager_arch }}"
homelab_manager_release_url: >-
  https://github.com/alexandrebouttierdev/homelab-manager/releases/download/v{{
  homelab_manager_version }}/{{ homelab_manager_release_name }}.tar.gz
homelab_manager_base_dir: /opt/homelab-manager
homelab_manager_download_dir: "{{ homelab_manager_base_dir }}/downloads"
homelab_manager_releases_dir: "{{ homelab_manager_base_dir }}/releases"
homelab_manager_release_dir: "{{ homelab_manager_releases_dir }}/{{ homelab_manager_release_name }}"
homelab_manager_config_dir: /etc/homelab-manager
homelab_manager_credential_path: /etc/credstore.encrypted/homelab-manager-secrets-key

homelab_manager_grype_deb: "grype_{{ homelab_manager_grype_version }}_linux_{{ homelab_manager_arch }}.deb"
homelab_manager_grype_url: >-
  https://github.com/anchore/grype/releases/download/v{{
  homelab_manager_grype_version }}/{{ homelab_manager_grype_deb }}

homelab_manager_binaries:
  - homelab-manager
  - homelab-docker-proxy
  - homelab-backup-runner

# Comptes système : le Manager n'est jamais root ni membre du groupe docker ;
# seul le proxy restreint accède au socket Docker.
homelab_manager_accounts: >-
  {{ ['homelab-manager', 'homelab-docker-proxy']
     + (['homelab-vulnscan'] if homelab_manager_vulnscan_enabled | bool else []) }}

homelab_manager_packages: >-
  {{ ['polkitd']
     + (['restic'] if homelab_manager_backup_enabled | bool else []) }}

homelab_manager_units: >-
  {{ ['homelab-manager.service', 'homelab-docker-proxy.service', 'homelab-docker-proxy.socket']
     + (['homelab-backup@.service'] if homelab_manager_backup_enabled | bool else [])
     + (['homelab-vulnscan.service'] if homelab_manager_vulnscan_enabled | bool else [])
     + (['homelab-journal-vacuum@.service'] if homelab_manager_journal_vacuum_enabled | bool else []) }}

homelab_manager_tmpfiles: >-
  {{ (['homelab-backup.conf'] if homelab_manager_backup_enabled | bool else [])
     + (['homelab-vulnscan.conf'] if homelab_manager_vulnscan_enabled | bool else []) }}

homelab_manager_polkit_rules: >-
  {{ (['50-homelab-manager-backup.rules'] if homelab_manager_backup_enabled | bool else [])
     + (['50-homelab-manager-vulnscan.rules'] if homelab_manager_vulnscan_enabled | bool else [])
     + (['50-homelab-manager-maintenance.rules'] if homelab_manager_journal_vacuum_enabled | bool else [])
     + (['50-homelab-manager-power.rules'] if homelab_manager_power_actions_enabled | bool else []) }}
