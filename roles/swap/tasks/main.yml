---
- name: Vérifier si le fichier swap existe
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file_stat
  when: swap_enabled

- name: Vérifier la taille du fichier swap existant
  ansible.builtin.assert:
    that:
      - swap_file_stat.stat.size == (swap_file_size_mb | int * 1024 * 1024)
    fail_msg: >-
      {{ swap_file_path }} existe mais sa taille ne correspond pas à
      swap_file_size_mb. Vérifier manuellement avant toute modification.
  when: swap_enabled and swap_file_stat.stat.exists

- name: Créer le fichier swap s'il est absent
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_file_size_mb }}M {{ swap_file_path }}"
    creates: "{{ swap_file_path }}"
  when: swap_enabled and not swap_file_stat.stat.exists

- name: Signaler les tâches swap non simulables
  ansible.builtin.debug:
    msg: >-
      {{ swap_file_path }} sera créé pendant l'application réelle du playbook ;
      sa configuration et son activation ne peuvent pas être prévisualisées.
  when:
    - swap_enabled
    - ansible_check_mode
    - not swap_file_stat.stat.exists

- name: Sécuriser les permissions du fichier swap
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists

- name: Vérifier le type de système de fichiers du fichier swap
  ansible.builtin.command:
    cmd: "blkid -p -o value -s TYPE {{ swap_file_path }}"
  register: swap_fs_type
  changed_when: false
  failed_when: false
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists

- name: Formater la zone swap uniquement si nécessaire
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file_path }}"
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists
    - swap_fs_type.stdout | trim != 'swap'

- name: Vérifier les zones swap actives
  ansible.builtin.command:
    cmd: swapon --noheadings --raw --show=NAME
  register: swap_active_swaps
  changed_when: false
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists

- name: Activer le fichier swap uniquement s'il est inactif
  ansible.builtin.command:
    cmd: "swapon {{ swap_file_path }}"
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists
    - swap_file_path not in swap_active_swaps.stdout_lines

- name: Persister le swap dans /etc/fstab
  ansible.builtin.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    state: present
  when:
    - swap_enabled
    - not ansible_check_mode or swap_file_stat.stat.exists
