---
- name: Vérifier que le token Cloudflare est défini si le tunnel est activé
  ansible.builtin.assert:
    that:
      - cloudflared_tunnel_token | length > 20
      - "'REMPLACER' not in cloudflared_tunnel_token"
    fail_msg: >-
      Définir cloudflared_tunnel_token dans inventory/group_vars/all/vault.yml
      (Ansible Vault), puis activer cloudflared_enabled.
  when: cloudflared_enabled | bool

- name: Installer les prérequis cloudflared
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
  when: cloudflared_enabled | bool

- name: Retirer l'ancien fichier sources.list cloudflared (migration deb822)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  when: cloudflared_enabled | bool

- name: Ajouter le dépôt officiel Cloudflare
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: https://pkg.cloudflare.com/cloudflared
    suites: any
    components:
      - main
    signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg
    state: present
    enabled: true
  when: cloudflared_enabled | bool

- name: Installer cloudflared
  ansible.builtin.apt:
    update_cache: true
    name: cloudflared
    state: present
  when: cloudflared_enabled | bool

- name: Créer un compte système dédié à Cloudflare Tunnel
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/cloudflared
    create_home: true
    home_mode: "0750"
  when: cloudflared_enabled | bool

- name: Créer le répertoire de configuration /etc/cloudflared
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: cloudflared
    mode: "0750"
  when: cloudflared_enabled | bool

- name: Déployer le fichier token protégé (/etc/cloudflared/tunnel.token)
  ansible.builtin.copy:
    dest: /etc/cloudflared/tunnel.token
    owner: root
    group: cloudflared
    mode: "0640"
    content: "{{ cloudflared_tunnel_token }}"
  when: cloudflared_enabled | bool
  no_log: true
  notify: Restart cloudflared

- name: Retirer l'ancien fichier d'environnement s'il existe
  ansible.builtin.file:
    path: /etc/cloudflared/tunnel.env
    state: absent
  when: cloudflared_enabled | bool

- name: Installer l'unité systemd cloudflared-homelab
  ansible.builtin.template:
    src: cloudflared-homelab.service.j2
    dest: /etc/systemd/system/cloudflared-homelab.service
    owner: root
    group: root
    mode: "0644"
  when: cloudflared_enabled | bool
  notify:
    - Reload systemd
    - Restart cloudflared

- name: Masquer le service cloudflared fourni par le paquet si présent
  ansible.builtin.systemd_service:
    name: cloudflared.service
    masked: true
    enabled: false
    state: stopped
  when: cloudflared_enabled | bool
  failed_when: false

- name: Activer et démarrer le tunnel Cloudflare
  ansible.builtin.systemd_service:
    name: cloudflared-homelab.service
    enabled: true
    state: started
    daemon_reload: true
  when: cloudflared_enabled | bool

- name: Arrêter le tunnel si désactivé
  ansible.builtin.systemd_service:
    name: cloudflared-homelab.service
    enabled: false
    state: stopped
  when: not (cloudflared_enabled | bool)
  failed_when: false
