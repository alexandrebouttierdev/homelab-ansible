---
# Sur Debian 13, le paquet cockpit-pcp n'est plus publié.
# Cockpit 337 fournit le module metrics ; PCP (pmcd + pmlogger) assure
# la collecte et l'historique côté Performance Co-Pilot.
- name: Collecter les paquets installés pour Cockpit et PCP
  ansible.builtin.package_facts:
    manager: auto
  when: cockpit_install | bool

- name: Installer Cockpit et Performance Co-Pilot (PCP)
  ansible.builtin.apt:
    name:
      - cockpit
      - cockpit-packagekit
      - pcp
    state: present
  when: cockpit_install | bool

- name: Activer et démarrer le collecteur PCP (pmcd)
  ansible.builtin.systemd_service:
    name: pmcd
    state: started
    enabled: true
  when:
    - cockpit_install | bool
    - not ansible_check_mode or 'pcp' in ansible_facts.packages

- name: Activer et démarrer pmlogger (historique des métriques)
  ansible.builtin.systemd_service:
    name: pmlogger
    state: started
    enabled: true
  when:
    - cockpit_install | bool
    - pcp_pmlogger_enabled | default(true) | bool
    - not ansible_check_mode or 'pcp' in ansible_facts.packages

- name: Activer et démarrer le socket Cockpit
  ansible.builtin.systemd_service:
    name: cockpit.socket
    state: started
    enabled: true
  when:
    - cockpit_install | bool
    - not ansible_check_mode or 'cockpit' in ansible_facts.packages
