---
- name: Installer Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: fail2ban_enabled | bool

- name: Collecter les services présents pour Fail2ban
  ansible.builtin.service_facts:
  when: fail2ban_enabled | bool

- name: Configurer la prison SSH (systemd backend)
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: fail2ban_enabled | bool

- name: Activer et démarrer Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when:
    - fail2ban_enabled | bool
    - not ansible_check_mode or 'fail2ban.service' in ansible_facts.services or 'fail2ban' in ansible_facts.services
